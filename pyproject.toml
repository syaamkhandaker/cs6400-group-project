[project]
name = "rag-hybrid"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "faiss-cpu>=1.15.1",
    "numpy>=2.2.6",
    "pytest>=9.2.0",
    "pyyaml>=6.0.3",
    "sentence-transformers>=6.2.0",
    "transformers>=5.20.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
